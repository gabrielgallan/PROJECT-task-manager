name: Run E2E tests - API task-manager

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/run-e2e-tests.yml'

  workflow_dispatch:

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://docker:docker@localhost:5432/task_manager
      REDIS_URL: redis://localhost:6379/0
      GITHUB_OAUTH_CLIENT_ID: dummy
      GITHUB_OAUTH_CLIENT_SECRET: dummy
      GITHUB_OAUTH_CLIENT_REDIRECT_URI: https://example.com/callback
      GOOGLE_OAUTH_CLIENT_ID: dummy
      GOOGLE_OAUTH_CLIENT_SECRET: dummy
      GOOGLE_OAUTH_CLIENT_REDIRECT_URI: https://example.com/callback
      RESEND_API_KEY: dummy
      CLOUDINARY_CLOUD_NAME: dummy
      CLOUDINARY_API_KEY: dummy
      CLOUDINARY_API_SECRET: dummy

    defaults:
      run:
        working-directory: ./api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docker -d task_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: ./api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run E2E tests
        run: pnpm test:e2e